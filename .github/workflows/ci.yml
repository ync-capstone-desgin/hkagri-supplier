# PR과 develop·main 푸시마다 백엔드 테스트와 화면 빌드를 자동으로 실행한다.
# 두 작업(backend, frontend)이 모두 통과해야 PR을 머지할 수 있다 (브랜치 보호 규칙).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers가 GitHub 러너의 Docker로 PostgreSQL을 띄워 테스트한다.
      - name: 테스트
        run: chmod +x gradlew && ./gradlew test --no-daemon
      - name: 실패한 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 타입 검사·빌드
        run: npm run build
      - name: 린트
        run: npm run lint
