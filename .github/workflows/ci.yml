# PR과 develop·main 푸시마다 백엔드 테스트와 화면 빌드를 자동으로 실행한다.
# 두 작업(backend, frontend)이 모두 통과해야 PR을 머지할 수 있다 (브랜치 보호 규칙).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # PR은 대상 브랜치, push는 직전 커밋의 SQL을 기준으로 기존 DB를 재현한다.
      - name: 업그레이드 기준 마이그레이션 준비
        working-directory: .
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/flyway-baseline"
          git archive "$BASE_SHA" backend/src/main/resources/db/migration |
            tar -x -C "$RUNNER_TEMP/flyway-baseline"
      # Testcontainers가 GitHub 러너의 Docker로 PostgreSQL을 띄워 테스트한다.
      - name: 테스트 및 기존 DB 업그레이드 검증
        run: |
          chmod +x gradlew
          ./gradlew test migrationUpgradeTest --no-daemon \
            -PflywayBaselineDir="$RUNNER_TEMP/flyway-baseline/backend/src/main/resources/db/migration"
      - name: 실패한 테스트 보고서 올리기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: |
            backend/build/reports/tests/test
            backend/build/reports/tests/migrationUpgradeTest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 타입 검사·빌드
        run: npm run build
      - name: 린트
        run: npm run lint
