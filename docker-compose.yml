# 로컬 개발·시연용 인프라. 기능이 추가되면 서비스를 늘린다.
services:
  postgres:
    image: postgres:16-alpine
    container_name: supplier-poc-db
    environment:
      POSTGRES_DB: ${DB_NAME:-supplier}
      POSTGRES_USER: ${DB_USER:-supplier}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supplier}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-supplier}"]
      interval: 5s
      retries: 10

  # 개발용 메일 서버: 실제로 보내지 않고 받은 메일을 웹(http://localhost:8025)에서 보여준다.
  mailpit:
    image: axllent/mailpit:latest
    container_name: supplier-poc-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
