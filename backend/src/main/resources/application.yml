spring:
  application:
    name: supplier-poc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:supplier}
    username: ${DB_USER:supplier}
    password: ${DB_PASSWORD:supplier}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  mvc:
    async:
      request-timeout: -1

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  zone: Asia/Seoul
  # 만료 예정으로 보는 최대 기간(일). 오늘부터 이 기간 안에 만료되면 "만료예정"
  expiry-horizon-days: 90
  mail-from: noreply@supplier-poc.local
  scan-cron: "0 0 8 * * *"
  relay-delay-ms: 10000
  seed-password: ${SEED_PASSWORD:demo1234!}
