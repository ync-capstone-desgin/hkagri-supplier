spring:
  application:
    name: supplier-poc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:supplier}
    username: ${DB_USER:supplier}
    password: ${DB_PASSWORD:supplier}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  mvc:
    async:
      request-timeout: -1
  # 첨부파일 업로드 한도. 기본값(1MB)으로는 일반 PDF도 막히므로 파일 크기 제한(NFR-006)에 맞춘다.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  zone: Asia/Seoul
  # 만료 예정으로 보는 최대 기간(일). 오늘부터 이 기간 안에 만료되면 "만료예정"
  expiry-horizon-days: 90
  # 알림 메일 발신 주소와, 메일 본문에 넣을 화면 주소
  mail-from: noreply@supplier-poc.local
  web-url: ${WEB_URL:http://localhost:5173}
  # 만료 점검 작업 실행 시각 (매일 08:00, Asia/Seoul)
  scan-cron: "0 0 8 * * *"
  # 발송 대기열(아웃박스) 확인 주기(ms)
  relay-delay-ms: 10000
  # 정기 작업 사용 여부 (테스트에서는 끈다)
  scheduling-enabled: true
  seed-password: ${SEED_PASSWORD:demo1234!}
  # 첨부파일 저장소: local(서버 디스크). 저장 위치 결정(D-4) 후 다른 방식을 추가한다.
  file:
    storage: ${FILE_STORAGE:local}
    # 서버 디스크에 저장할 폴더. 운영에서는 Docker 볼륨 경로로 지정한다.
    dir: ${FILE_DIR:./data/files}
